<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled workspace</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Main Canvas -->
    <canvas id="main-canvas"></canvas>

    <!-- UI Controls -->
    <div class="ui-controls">
        <!-- Top Bar -->
        <div class="top-bar">

            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search items..." />
                <div id="search-dropdown" class="search-dropdown hidden"></div>
            </div>

            <button id="help-btn" class="control-btn" title="Help">❓</button>
        </div>
    </div>

    <!-- Context Menus -->
    <div id="canvas-context-menu" class="context-menu hidden">
        <div class="menu-item" data-action="add-material">Add Material</div>
        <div class="menu-item" data-action="add-light">Add Light</div>
        <div class="menu-item" data-action="add-axis">Add Axis</div>
    </div>

    <div id="item-context-menu" class="context-menu hidden">
        <div class="menu-item" data-action="edit">Edit</div>
        <div class="menu-item" data-action="hide">Hide</div>
        <div class="menu-item" data-action="delete">Delete</div>
        <div class="menu-item" data-action="link-item" id="link-option">Link</div>
        <div class="menu-item" data-action="toggle-status" id="toggle-option">Toggle</div>
        <div class="menu-item" data-action="select-color" id="color-option">Change Color</div>
    </div>

    <!-- Modals -->
    <div id="help-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Help & Instructions</h2>
            <div class="help-content">
                <!-- Help content will be populated by JS -->
            </div>
        </div>
    </div>

    <!-- Side Panel for Editing -->
    <div id="side-panel" class="side-panel hidden">
        <div class="panel-content">
            <!-- Title container with icon and input -->
            <div class="title-container">
                <div id="item-icon" class="item-icon hidden"></div>
                <input type="text" id="item-title-input" placeholder="Item title..." />
            </div>
            <textarea id="item-body-input" placeholder="Item content (markdown)..."></textarea>
        </div>
    </div>

    <!-- Inline Title Editor (hidden) -->
    <input type="text" id="inline-title-input" class="inline-title-editor hidden" placeholder="Enter title..." />

    <!-- File Input (hidden) -->
    <input type="file" id="world-input" accept=".world.json" />
    <input type="file" id="workspace-input" accept=".workspace.json" style="display: none;" />
    <input type="file" id="icon-input" accept=".png,.gif" style="display: none;" />

    <script src="https://cdn.jsdelivr.net/npm/libgif@0.0.3/libgif.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
